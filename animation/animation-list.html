<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .icon-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: top 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .icon-wrapper.moved {
            top: 25%;
            transform: translate(-50%, -50%);
        }

        .icon {
            width: 180px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            letter-spacing: 2px;
        }

        .list-container {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
            overflow: hidden;
            transform: translateY(100vh);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .list-container.visible {
            transform: translateY(0);
        }

        .list {
            width: 90%;
            max-width: 400px;
            list-style: none;
        }

        .list-item {
            background: white;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .list-container.visible .list-item {
            opacity: 1;
            transform: translateY(0);
        }

        .list-container.visible .list-item:nth-child(1) { transition-delay: 0.2s; }
        .list-container.visible .list-item:nth-child(2) { transition-delay: 0.4s; }
        .list-container.visible .list-item:nth-child(3) { transition-delay: 0.6s; }
        .list-container.visible .list-item:nth-child(4) { transition-delay: 0.8s; }
        .list-container.visible .list-item:nth-child(5) { transition-delay: 1.0s; }

        .item-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="icon-wrapper" id="iconWrapper">
        <div class="icon">My App</div>
    </div>

    <div class="list-container" id="listContainer">
        <ul class="list">
            <li class="list-item">
                <div class="item-icon">&#128203;</div>
                <span>Item One</span>
            </li>
            <li class="list-item">
                <div class="item-icon">&#128187;</div>
                <span>Item Two</span>
            </li>
            <li class="list-item">
                <div class="item-icon">&#128242;</div>
                <span>Item Three</span>
            </li>
            <li class="list-item">
                <div class="item-icon">&#127909;</div>
                <span>Item Four</span>
            </li>
            <li class="list-item">
                <div class="item-icon">&#127911;</div>
                <span>Item Five</span>
            </li>
        </ul>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('iconWrapper').classList.add('moved');
            document.getElementById('listContainer').classList.add('visible');
        }, 1000);
    </script>
</body>
</html>
